spring.application.name=LocalizaISP

# Carrega as variaveis do arquivo .env (raiz do projeto), se existir
spring.config.import=optional:file:.env[.properties]

# Perfil padrao: local (pode ser sobrescrito pela variavel SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Banco de dados (valores vindos do .env ou das variaveis de ambiente)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
