spring.application.name=localizaisp
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none



spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.seed_name=${SEED_NAME}
spring.flyway.placeholders.seed_email=${SEED_EMAIL}
spring.flyway.placeholders.seed_senha=${SEED_SENHA}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt_secret = ${JWT_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:fotos-casos}
supabase.signed-url-seconds=3600
